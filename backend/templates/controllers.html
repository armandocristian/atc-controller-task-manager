<!DOCTYPE html>

<html>

<head>

<title>
ATC Controllers
</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">

</head>


<body class="container mt-5">


<h1>
👨‍✈️ Controllers
</h1>


<table class="table">


<tr>

<th>
Name
</th>

<th>
Sector
</th>

<th>
Role
</th>

</tr>



{% for controller in controllers %}


<tr>

<td>
{{controller.name}}
</td>


<td>
{{controller.sector}}
</td>


<td>
{{controller.role}}
</td>


</tr>


{% endfor %}


</table>


<a href="/" class="btn btn-primary">
Dashboard
</a>


</body>

</html>

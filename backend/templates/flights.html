<!DOCTYPE html>

<html>

<head>

<title>
ATC Flights
</title>

<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">

</head>


<body class="container mt-5">


<h1>
✈ Active Flights
</h1>


<table class="table table-striped">


<tr>

<th>
Flight Number
</th>

<th>
Aircraft
</th>

<th>
Route
</th>

<th>
Status
</th>

</tr>



{% for flight in flights %}


<tr>

<td>
{{flight.flight_number}}
</td>


<td>
{{flight.aircraft}}
</td>


<td>

{{flight.departure}}

-

{{flight.destination}}

</td>


<td>
{{flight.status}}
</td>


</tr>


{% endfor %}


</table>


<a href="/" class="btn btn-primary">
Back Dashboard
</a>


</body>

</html>
